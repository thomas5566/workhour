name: Production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workhour-production
  cancel-in-progress: false

jobs:
  backend-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m compileall -q app migrations tests
      - run: python -m pytest -q

  frontend-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint . --max-warnings=0
      - run: pnpm test
      - run: pnpm build

  build-and-publish:
    needs: [backend-verification, frontend-verification]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the exact tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish immutable release images
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          backend="ghcr.io/thomas5566/workhour-backend:$RELEASE_SHA"
          frontend="ghcr.io/thomas5566/workhour-frontend:$RELEASE_SHA"
          docker build \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --tag "$backend" ./backend
          docker build \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --tag "$frontend" ./frontend
          docker push "$backend"
          docker push "$frontend"
