x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg2://workhour:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/workhour
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:8080","http://localhost:5173"]}

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: workhour
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: workhour
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workhour -d workhour"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: python -m alembic upgrade head
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "5566:5566"
    environment: *backend-environment
    # Keep schema changes outside API startup. A failed migration prevents an
    # incompatible application process from accepting requests.
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
